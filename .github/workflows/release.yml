name: Release

# Triggered by pushing a SemVer tag, e.g. `git tag v0.1.1 && git push origin v0.1.1`, once CI is green on
# that commit. If the xcode-27 runner is unavailable: Actions → Release → Run workflow, with
# runner = macos-26 and the existing tag.
# Builds the universal CLI binaries + the app, signs the app archive for Sparkle, regenerates the
# appcast, and publishes a GitHub Release with everything attached. Nothing here needs a paid Apple
# cert: the app is ad-hoc signed, not notarized (first launch: System Settings → Privacy & Security →
# Open Anyway), and the only secret is the Sparkle EdDSA private key (SPARKLE_ED_PRIVATE_KEY) used to
# sign update archives — it never lands in the repo.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner image (macos-26 is the fallback when xcode-27 is unavailable)"
        default: "xcode-27"
        type: choice
        options: ["xcode-27", "macos-26"]
      tag:
        description: "Existing vX.Y.Z tag to build"
        required: true
        type: string

permissions:
  contents: write          # create the GitHub Release

env:
  SPARKLE_TOOLS_VERSION: "2.10.0"  # must equal the Sparkle version Package.resolved pins (bump both together); `sign_update` comes from this tarball

jobs:
  release:
    # xcode-27 = macOS 27 + the Xcode 27 SDK (public-preview label), the same runner CI uses. The app
    # needs the macOS 26 SDK or newer to COMPILE its Liquid Glass path (`glassEffect`); it still RUNS on
    # macOS 14+ (the call is guarded by `if #available`). macos-26 (Xcode 26) stays selectable as the
    # workflow_dispatch fallback and builds the same app.
    runs-on: ${{ inputs.runner || 'xcode-27' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}   # a manual run builds the named tag, not the branch
          fetch-depth: 0           # need full history for a monotonic build number

      - name: Resolve version + build number
        id: meta
        env:
          # via env, not inline ${{ }}, so a hand-typed dispatch input can't be injected into the script
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$GITHUB_REF_NAME}"   # a manual run's GITHUB_REF_NAME is the branch, e.g. main
          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            echo "::error::No tag to release. Push a vX.Y.Z tag, or run the workflow with the tag input."; exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"; exit 1
          fi
          VERSION="${TAG#v}"
          CONSTANT="$(sed -n 's/.*public static let current = "\(.*\)".*/\1/p' Sources/Engram/Version.swift)"
          if [ "$VERSION" != "$CONSTANT" ]; then
            echo "::error::Tag $TAG doesn't match EngramVersion.current ('$CONSTANT') in Sources/Engram/Version.swift"; exit 1
          fi
          NOTES_FILE="packaging/release-notes/${VERSION}.html"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "::error::$NOTES_FILE is missing. Add the update notes before tagging."; exit 1
          fi
          BUILD="$(git rev-list --count HEAD)"   # monotonic — Sparkle compares CFBundleVersion
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "Building Engram $VERSION (build $BUILD) from $TAG"
          swift --version
          xcodebuild -version || true

      - name: Test
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/engram-tests"
          mkdir -p "$T"
          ENGRAM_ROOT="$T/memories" \
          ENGRAM_CLAUDE_CONFIG="$T/claude_desktop_config.json" \
          ENGRAM_CLAUDE_CODE_CONFIG="$T/claude.json" \
          ENGRAM_CLAUDE_LOGS="$T/logs" \
            swift test

      # ---------- universal CLI binaries (engram-mcp + engram-capture) ----------
      - name: Build CLI (universal arm64 + x86_64)
        run: |
          set -euo pipefail
          # Build each product in its OWN invocation: a single `swift build` with multiple --product
          # AND multiple --arch only lipo-merges one product's universal binary (the other is left
          # absent). Separate builds reliably produce a universal binary for each.
          swift build -c release --arch arm64 --arch x86_64 --product engram-mcp
          swift build -c release --arch arm64 --arch x86_64 --product engram-capture
          BIN="$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)"
          mkdir -p dist
          for b in engram-mcp engram-capture; do
            test -f "$BIN/$b" || { echo "::error::$b missing from $BIN after build"; exit 1; }
            cp "$BIN/$b" dist/
          done
          lipo -info dist/engram-mcp dist/engram-capture   # both must be fat (x86_64 + arm64)
          # Xcode 27's swift build stamps the deployment target as the linked SDK; put the real one back.
          bash packaging/stamp-sdk.sh dist/engram-mcp dist/engram-capture

      - name: Package CLI tarball + checksum
        run: |
          set -euo pipefail
          cd dist
          # COPYFILE_DISABLE: no AppleDouble (._*) files or stray xattrs in the archive — a clean tarball.
          COPYFILE_DISABLE=1 tar -czf engram-cli-macos-universal.tar.gz engram-mcp engram-capture
          shasum -a 256 engram-cli-macos-universal.tar.gz | tee engram-cli-macos-universal.tar.gz.sha256

      # ---------- the GUI app (ad-hoc signed, not notarized, universal) ----------
      - name: Build Engram.app (universal, ad-hoc signed)
        env:
          SWIFT_BUILD_FLAGS: "--arch arm64 --arch x86_64"
          OUT_DIR: "dist"
          APP_VERSION: ${{ steps.meta.outputs.version }}
          APP_BUILD: ${{ steps.meta.outputs.build }}
        run: bash packaging/make-app.sh

      - name: Check the embedded Sparkle
        run: |
          set -euo pipefail
          EMBEDDED="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" dist/Engram.app/Contents/Frameworks/Sparkle.framework/Resources/Info.plist)"
          echo "Engram.app embeds Sparkle $EMBEDDED; sign_update comes from $SPARKLE_TOOLS_VERSION"
          if [ "$EMBEDDED" != "$SPARKLE_TOOLS_VERSION" ]; then
            echo "::error::Engram.app embeds Sparkle $EMBEDDED, not $SPARKLE_TOOLS_VERSION. Keep Package.resolved and SPARKLE_TOOLS_VERSION in step."; exit 1
          fi

      - name: Zip Engram.app + checksum
        run: |
          set -euo pipefail
          ZIP="dist/Engram-${{ steps.meta.outputs.version }}.zip"
          ditto -c -k --keepParent "dist/Engram.app" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"

      # ---------- Sparkle: sign the app archive + (re)build the appcast ----------
      - name: Fetch Sparkle sign_update
        run: |
          set -euo pipefail
          URL="https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_TOOLS_VERSION}/Sparkle-${SPARKLE_TOOLS_VERSION}.tar.xz"
          curl -fsSL "$URL" -o sparkle.tar.xz
          mkdir -p sparkle && tar -xJf sparkle.tar.xz -C sparkle
          echo "SIGN_UPDATE=$(find "$PWD/sparkle" -name sign_update -type f | head -n1)" >> "$GITHUB_ENV"

      - name: Build signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.meta.outputs.version }}"
          BUILD="${{ steps.meta.outputs.build }}"
          TAG="${{ steps.meta.outputs.tag }}"
          ZIP="dist/Engram-${VERSION}.zip"
          ENCLOSURE_URL="https://github.com/albertofettucini/Engram/releases/download/${TAG}/Engram-${VERSION}.zip"

          if [ -z "${SPARKLE_ED_PRIVATE_KEY:-}" ]; then
            echo "::warning::SPARKLE_ED_PRIVATE_KEY is not set — skipping appcast (the .app still ships, but in-app updates won't be fed). Set the secret before a real release."
            exit 0
          fi

          # Sign the archive. Key from CI secret via a temp file (chmod 600, removed after).
          KEYFILE="$RUNNER_TEMP/sparkle_ed_priv"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEYFILE"
          chmod 600 "$KEYFILE"
          # Accept either the long or short key-file flag, depending on the Sparkle tools version.
          if "$SIGN_UPDATE" --help 2>&1 | grep -q -- '--ed-key-file'; then
            SIGN_OUT="$("$SIGN_UPDATE" --ed-key-file "$KEYFILE" "$ZIP")"
          else
            SIGN_OUT="$("$SIGN_UPDATE" -f "$KEYFILE" "$ZIP")"
          fi
          rm -f "$KEYFILE"
          echo "sign_update: $SIGN_OUT"
          SIG="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          LEN="$(printf '%s' "$SIGN_OUT" | sed -n 's/.*length="\([^"]*\)".*/\1/p')"
          if [ -z "$SIG" ] || [ -z "$LEN" ]; then
            echo "::error::could not parse sign_update output"; exit 1
          fi

          # Carry history forward: pull the previous feed (404 on the first release → start fresh).
          curl -fsSL "https://github.com/albertofettucini/Engram/releases/latest/download/appcast.xml" \
            -o prev-appcast.xml || echo "no previous appcast (first release)"

          PREV_ARG=""
          if [ -s prev-appcast.xml ]; then PREV_ARG="--prev prev-appcast.xml"; fi   # -s: exists AND non-empty
          # The update notes come from a tracked file (no here-doc: the runner's bash 3.2 breaks on an
          # apostrophe in a here-doc inside $(...)).
          python3 packaging/make-appcast.py \
            --version "$VERSION" --build "$BUILD" --min-os "14.0" \
            --url "$ENCLOSURE_URL" --signature "$SIG" --length "$LEN" \
            --notes "$(cat "${{ steps.meta.outputs.notes }}")" \
            $PREV_ARG \
            --out dist/appcast.xml
          echo "----- appcast.xml -----"; cat dist/appcast.xml

      # ---------- publish ----------
      - name: Create / update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          VERSION="${{ steps.meta.outputs.version }}"
          ASSETS=(
            "dist/Engram-${VERSION}.zip"
            "dist/Engram-${VERSION}.zip.sha256"
            "dist/engram-cli-macos-universal.tar.gz"
            "dist/engram-cli-macos-universal.tar.gz.sha256"
          )
          [ -f dist/appcast.xml ] && ASSETS+=("dist/appcast.xml")

          # The body is a tracked template rendered to a file and passed with --notes-file. No here-doc:
          # the runner's /bin/bash is 3.2, which breaks on an apostrophe in a here-doc inside $(...).
          BODY="$RUNNER_TEMP/body.md"
          sed "s/VERSION/${VERSION}/g" packaging/release-body.md > "$BODY"
          echo "----- release body -----"; cat "$BODY"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "Engram ${VERSION}" --notes-file "$BODY"
          fi
